name: Generar lockfile hardening

on:
  push:
    branches: [hardening-integridad-financiera]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hardening-integridad-financiera

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar package-lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json ya está actualizado"
          else
            git commit -m "Generate package-lock for deterministic installs [skip ci]"
            git push origin HEAD:hardening-integridad-financiera
          fi
