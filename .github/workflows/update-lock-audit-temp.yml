name: Actualizar lock y auditar temporal

on:
  push:
    branches: [hardening-ux-limpieza]
    paths:
      - .github/workflows/update-lock-audit-temp.yml

permissions:
  contents: write

jobs:
  lock-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-ux-limpieza
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerar lock
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Verificar auditoría
        run: npm audit || true
      - name: Commit lock actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile sin cambios"
          else
            git commit -m "Refresh lockfile after dependency cleanup [skip ci]"
            git push origin HEAD:hardening-ux-limpieza
          fi
