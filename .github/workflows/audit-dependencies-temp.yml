name: Auditar dependencias temporal

on:
  push:
    branches: [hardening-ux-limpieza]
    paths:
      - .github/workflows/audit-dependencies-temp.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-ux-limpieza
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit runtime
        run: npm audit --omit=dev || true
      - name: Audit completo JSON
        run: npm audit --json || true
