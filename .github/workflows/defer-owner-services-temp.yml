name: Implementar pendiente propietario diferido

on:
  push:
    branches: [pendiente-propietario-diferido]
    paths:
      - .github/workflows/defer-owner-services-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pendiente-propietario-diferido
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Aplicar cambios
        run: |
          python - <<'PY'
          from pathlib import Path

          # types.ts
          p = Path('src/types.ts')
          s = p.read_text()
          marker = "export type OwnerPaymentPurpose = 'REPARACIONES' | 'SERVICIOS';\nexport type OwnerPaymentMode = 'TRANSFERIDO_FAUNA' | 'PAGADO_DIRECTO';\n"
          replacement = marker + "\nexport interface OwnerServiceDeferral {\n  amountAtDeferral: number;\n  reason: string;\n  nextReviewDate: string;\n  responsible: string;\n  createdAt: string;\n  createdBy: string;\n}\n"
          if marker not in s: raise SystemExit('types marker 1 missing')
          s = s.replace(marker, replacement, 1)
          marker2 = "  ownerContribution: number;\n  fullCoverageApplied: number;\n  faunaFinancing: number;\n"
          replacement2 = "  ownerContribution: number;\n  fullCoverageApplied: number;\n  faunaFinancing: number;\n  ownerServiceDeferral?: OwnerServiceDeferral;\n"
          if marker2 not in s: raise SystemExit('types marker 2 missing')
          s = s.replace(marker2, replacement2, 1)
          p.write_text(s)

          # AppContext.tsx: a pending service balance can be considered operationally resolved when explicitly deferred.
          p = Path('src/context/AppContext.tsx')
          s = p.read_text()
          old = "  const readiness = calculateFundingReadiness(c, settings);\n  if (readiness.ownerServicePending > 0) return false;\n\n  return true;\n"
          new = "  const readiness = calculateFundingReadiness(c, settings);\n  if (readiness.ownerServicePending > 0 && !c.ownerServiceDeferral) return false;\n\n  return true;\n"
          if old not in s: raise SystemExit('AppContext completion marker missing')
          s = s.replace(old, new, 1)
          old2 = "      if (calculateFundingReadiness(targetCase, settings).ownerServicePending > 0) pending.push('gastos comunes/servicios pendientes del propietario');\n"
          new2 = "      if (calculateFundingReadiness(targetCase, settings).ownerServicePending > 0 && !targetCase.ownerServiceDeferral) pending.push('gastos comunes/servicios pendientes del propietario sin acuerdo de diferimiento');\n"
          if old2 not in s: raise SystemExit('AppContext close marker missing')
          s = s.replace(old2, new2, 1)
          p.write_text(s)

          # FullCoverageCaseBanner.tsx
          p = Path('src/components/FullCoverageCaseBanner.tsx')
          s = p.read_text()
          state_marker = "  const [paymentNotes, setPaymentNotes] = useState('');\n  const [paymentError, setPaymentError] = useState('');\n"
          state_repl = state_marker + "  const [deferralModalOpen, setDeferralModalOpen] = useState(false);\n  const [deferralReason, setDeferralReason] = useState('');\n  const [deferralDate, setDeferralDate] = useState('');\n  const [deferralResponsible, setDeferralResponsible] = useState('');\n  const [deferralError, setDeferralError] = useState('');\n"
          if state_marker not in s: raise SystemExit('banner state marker missing')
          s = s.replace(state_marker, state_repl, 1)

          pending_marker = "  const damagePending = readiness.ownerRepairPendingProvision;\n  const servicesPending = readiness.ownerServicePending;\n  const selectedPending = paymentPurpose === 'REPARACIONES' ? damagePending : servicesPending;\n"
          pending_repl = "  const damagePending = readiness.ownerRepairPendingProvision;\n  const servicesPending = readiness.ownerServicePending;\n  const activeServiceDeferral = servicesPending > 0 ? guaranteeCase.ownerServiceDeferral : undefined;\n  const selectedPending = paymentPurpose === 'REPARACIONES' ? damagePending : servicesPending;\n"
          if pending_marker not in s: raise SystemExit('banner pending marker missing')
          s = s.replace(pending_marker, pending_repl, 1)

          fn_marker = "    setPaymentModalOpen(false);\n  };\n\n  return (\n"
          fn_repl = """    setPaymentModalOpen(false);\n  };\n\n  const openServiceDeferral = () => {\n    if (!isConfirmed || servicesPending <= 0) return;\n    setDeferralReason(guaranteeCase.ownerServiceDeferral?.reason || '');\n    setDeferralDate(guaranteeCase.ownerServiceDeferral?.nextReviewDate || '');\n    setDeferralResponsible(guaranteeCase.ownerServiceDeferral?.responsible || guaranteeCase.responsible || '');\n    setDeferralError('');\n    setDeferralModalOpen(true);\n  };\n\n  const registerServiceDeferral = (event: React.FormEvent) => {\n    event.preventDefault();\n    if (!isConfirmed || servicesPending <= 0) return;\n    if (!deferralReason.trim() || !deferralDate || !deferralResponsible) {\n      setDeferralError('Indica el acuerdo/motivo, la próxima fecha de revisión y el responsable.');\n      return;\n    }\n\n    const existing = guaranteeCase.ownerServiceDeferral;\n    updateGuaranteeCase(guaranteeCase.id, {\n      ownerServiceDeferral: {\n        amountAtDeferral: existing?.amountAtDeferral || servicesPending,\n        reason: deferralReason.trim(),\n        nextReviewDate: deferralDate,\n        responsible: deferralResponsible,\n        createdAt: existing?.createdAt || new Date().toISOString(),\n        createdBy: existing?.createdBy || userRole\n      },\n      nextManagement: `Revisar pendiente propietario de ${formatCLP(servicesPending)}`,\n      nextManagementDate: deferralDate,\n      nextManagementResponsible: deferralResponsible\n    });\n    logAudit(\n      guaranteeCase.id,\n      existing ? 'Pendiente propietario actualizado' : 'Pendiente propietario diferido',\n      `${formatCLP(servicesPending)} en gastos comunes/servicios · ${deferralReason.trim()} · próxima revisión ${formatDate(deferralDate)} · responsable ${deferralResponsible}`\n    );\n    setDeferralModalOpen(false);\n  };\n\n  return (\n"""
          if fn_marker not in s: raise SystemExit('banner fn marker missing')
          # add logAudit to destructuring
          s = s.replace("    updateGuaranteeCase,\n    addFinancialMovement\n", "    updateGuaranteeCase,\n    addFinancialMovement,\n    logAudit\n", 1)
          s = s.replace(fn_marker, fn_repl, 1)

          old_service = """        {servicesPending > 0 && (\n          <div className=\"bg-sky-300/10 border border-sky-300/25 rounded-xl p-3 flex flex-col md:flex-row md:items-center justify-between gap-3 text-[11px] text-sky-50\">\n            <div className=\"flex items-start gap-2.5\">\n              <Clock3 className=\"w-4 h-4 shrink-0 mt-0.5 text-sky-200\" />\n              <div>\n                <strong className=\"block text-xs\">Quedan {formatCLP(servicesPending)} pendientes del propietario en gastos comunes y/o servicios.</strong>\n                <span className=\"block mt-0.5\">Este saldo no bloquea la liquidación. Registra el pago solo cuando el propietario efectivamente lo haya asumido.</span>\n              </div>\n            </div>\n            <button type=\"button\" onClick={() => openOwnerPayment('SERVICIOS')} className=\"shrink-0 px-3.5 py-2 rounded-xl bg-white text-emerald-950 hover:bg-emerald-50 text-xs font-extrabold inline-flex items-center justify-center gap-1.5 cursor-pointer\">\n              <Banknote className=\"w-4 h-4\" /> Registrar pago propietario\n            </button>\n          </div>\n        )}\n"""
          new_service = """        {servicesPending > 0 && (\n          <div className=\"bg-sky-300/10 border border-sky-300/25 rounded-xl p-3 flex flex-col md:flex-row md:items-center justify-between gap-3 text-[11px] text-sky-50\">\n            <div className=\"flex items-start gap-2.5 min-w-0\">\n              <Clock3 className=\"w-4 h-4 shrink-0 mt-0.5 text-sky-200\" />\n              <div className=\"min-w-0\">\n                <strong className=\"block text-xs\">Quedan {formatCLP(servicesPending)} pendientes del propietario en gastos comunes y/o servicios.</strong>\n                {activeServiceDeferral ? (\n                  <>\n                    <span className=\"block mt-0.5 font-semibold text-sky-100\">Pendiente diferido: {activeServiceDeferral.reason}</span>\n                    <span className=\"block mt-0.5 text-sky-200\">Revisar {formatDate(activeServiceDeferral.nextReviewDate)} · {activeServiceDeferral.responsible}</span>\n                  </>\n                ) : (\n                  <span className=\"block mt-0.5\">Este saldo no bloquea la liquidación. Después de confirmar puedes registrar el pago o dejar formalmente el pendiente diferido.</span>\n                )}\n              </div>\n            </div>\n            <div className=\"shrink-0 flex flex-wrap gap-2 justify-end\">\n              <button type=\"button\" onClick={() => openOwnerPayment('SERVICIOS')} className=\"px-3.5 py-2 rounded-xl bg-white text-emerald-950 hover:bg-emerald-50 text-xs font-extrabold inline-flex items-center justify-center gap-1.5 cursor-pointer\">\n                <Banknote className=\"w-4 h-4\" /> Registrar pago\n              </button>\n              {isConfirmed && (\n                <button type=\"button\" onClick={openServiceDeferral} className=\"px-3.5 py-2 rounded-xl bg-sky-100/10 border border-sky-200/40 text-white hover:bg-sky-100/20 text-xs font-extrabold cursor-pointer\">\n                  {activeServiceDeferral ? 'Editar pendiente' : 'Dejar pendiente'}\n                </button>\n              )}\n            </div>\n          </div>\n        )}\n"""
          if old_service not in s: raise SystemExit('banner service block missing')
          s = s.replace(old_service, new_service, 1)

          modal_marker = "      {paymentModalOpen && (\n"
          deferral_modal = """      {deferralModalOpen && (\n        <div className=\"fixed inset-0 z-[72] bg-slate-900/65 backdrop-blur-xs flex items-center justify-center p-4\">\n          <div className=\"bg-white text-slate-800 rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200\">\n            <div className=\"bg-slate-900 text-white p-5 flex items-center justify-between\">\n              <div>\n                <h3 className=\"font-bold text-base\">Dejar pendiente del propietario</h3>\n                <p className=\"text-xs text-slate-300 mt-0.5\">Gastos comunes/servicios · {formatCLP(servicesPending)}</p>\n              </div>\n              <button type=\"button\" onClick={() => setDeferralModalOpen(false)} className=\"p-1 text-slate-400 hover:text-white cursor-pointer\">\n                <X className=\"w-5 h-5\" />\n              </button>\n            </div>\n            <form onSubmit={registerServiceDeferral} className=\"p-6 space-y-4 text-xs\">\n              <div className=\"bg-sky-50 border border-sky-200 rounded-xl p-3 text-[11px] text-sky-950\">\n                La liquidación puede cerrarse sin registrar un pago ficticio. El saldo seguirá visible como pendiente del propietario hasta que se cubra efectivamente.\n              </div>\n              <div>\n                <label className=\"block font-bold text-slate-800 mb-1\">Acuerdo / motivo *</label>\n                <textarea rows={3} required value={deferralReason} onChange={e => { setDeferralReason(e.target.value); setDeferralError(''); }} placeholder=\"Ej. Propietario solicita pagarlo cuando ingrese el próximo arrendatario\" className=\"w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5\" />\n              </div>\n              <div className=\"grid grid-cols-1 sm:grid-cols-2 gap-3\">\n                <div>\n                  <label className=\"block font-bold text-slate-800 mb-1\">Próxima revisión *</label>\n                  <input type=\"date\" required value={deferralDate} onChange={e => { setDeferralDate(e.target.value); setDeferralError(''); }} className=\"w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5\" />\n                </div>\n                <div>\n                  <label className=\"block font-bold text-slate-800 mb-1\">Responsable *</label>\n                  <select required value={deferralResponsible} onChange={e => { setDeferralResponsible(e.target.value); setDeferralError(''); }} className=\"w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5\">\n                    <option value=\"\">Seleccionar</option>\n                    {settings.responsiblesList.map(r => <option key={r} value={r}>{r}</option>)}\n                  </select>\n                </div>\n              </div>\n              {deferralError && <div className=\"bg-rose-50 border border-rose-200 rounded-xl p-3 text-[11px] font-semibold text-rose-800\">{deferralError}</div>}\n              <div className=\"pt-3 border-t border-slate-100 flex justify-end gap-2\">\n                <button type=\"button\" onClick={() => setDeferralModalOpen(false)} className=\"px-4 py-2 border border-slate-300 text-slate-600 rounded-lg font-semibold cursor-pointer\">Cancelar</button>\n                <button type=\"submit\" className=\"px-5 py-2 bg-sky-700 hover:bg-sky-800 text-white font-bold rounded-lg cursor-pointer\">Guardar pendiente</button>\n              </div>\n            </form>\n          </div>\n        </div>\n      )}\n\n"""
          if modal_marker not in s: raise SystemExit('banner modal marker missing')
          s = s.replace(modal_marker, deferral_modal + modal_marker, 1)
          p.write_text(s)

          # Dashboard: keep owner service pending visible even on closed cases.
          p = Path('src/components/Dashboard.tsx')
          s = p.read_text()
          old = "  const fundingByCase = new Map<string, ReturnType<typeof calculateFundingReadiness>>(\n    openCases.map(c => [c.id, calculateFundingReadiness(c, settings)] as const)\n  );\n"
          new = "  const fundingByCase = new Map<string, ReturnType<typeof calculateFundingReadiness>>(\n    cases.map(c => [c.id, calculateFundingReadiness(c, settings)] as const)\n  );\n"
          if old not in s: raise SystemExit('dashboard map marker missing')
          s = s.replace(old, new, 1)
          old2 = "  const ownerServicePending = openCases.reduce(\n    (sum, c) => sum + (fundingByCase.get(c.id)?.ownerServicePending || 0),\n    0\n  );\n"
          new2 = "  const ownerServicePending = cases.reduce(\n    (sum, c) => sum + (fundingByCase.get(c.id)?.ownerServicePending || 0),\n    0\n  );\n  const ownerServiceDeferredCount = cases.filter(c =>\n    Boolean(c.ownerServiceDeferral) && (fundingByCase.get(c.id)?.ownerServicePending || 0) > 0\n  ).length;\n"
          if old2 not in s: raise SystemExit('dashboard service marker missing')
          s = s.replace(old2, new2, 1)
          old3 = "<div><span className=\"text-[10px] font-extrabold text-slate-600 uppercase block\">Servicios pendientes del propietario</span><span className=\"text-[11px] text-slate-500\">No bloquean la liquidación</span></div>"
          new3 = "<div><span className=\"text-[10px] font-extrabold text-slate-600 uppercase block\">Servicios pendientes del propietario</span><span className=\"text-[11px] text-slate-500\">No bloquean la liquidación{ownerServiceDeferredCount > 0 ? ` · ${ownerServiceDeferredCount} diferido${ownerServiceDeferredCount > 1 ? 's' : ''}` : ''}</span></div>"
          if old3 not in s: raise SystemExit('dashboard card marker missing')
          s = s.replace(old3, new3, 1)
          p.write_text(s)

          # GuaranteesList: filter and badge for owner pending, including closed cases.
          p = Path('src/components/GuaranteesList.tsx')
          s = p.read_text()
          s = s.replace("import { calculateGuaranteeFinances } from '../utils/calculations';", "import { calculateFundingReadiness, calculateGuaranteeFinances } from '../utils/calculations';", 1)
          old = "    if (filterCaseStatus === 'OPEN' && c.isClosed) return false;\n    if (filterCaseStatus === 'CLOSED' && !c.isClosed) return false;\n\n    const term = searchTerm.toLowerCase();\n"
          new = "    if (filterCaseStatus === 'OPEN' && c.isClosed) return false;\n    if (filterCaseStatus === 'CLOSED' && !c.isClosed) return false;\n    if (filterCaseStatus === 'OWNER_PENDING' && calculateFundingReadiness(c, settings).ownerServicePending <= 0) return false;\n\n    const term = searchTerm.toLowerCase();\n"
          if old not in s: raise SystemExit('guarantees filter marker missing')
          s = s.replace(old, new, 1)
          old2 = "              <option value=\"OPEN\">🟢 Abiertos</option>\n              <option value=\"CLOSED\">🔒 Cerrados</option>\n"
          new2 = "              <option value=\"OPEN\">🟢 Abiertos</option>\n              <option value=\"CLOSED\">🔒 Cerrados</option>\n              <option value=\"OWNER_PENDING\">Pendiente propietario</option>\n"
          if old2 not in s: raise SystemExit('guarantees select marker missing')
          s = s.replace(old2, new2, 1)
          row_marker = "                const settlement = getSettlementState(c, receivable, settings);\n                const overdueMgmt = !c.isClosed && Boolean(c.nextManagementDate) && isOverdue(c.nextManagementDate);\n"
          row_repl = "                const settlement = getSettlementState(c, receivable, settings);\n                const readiness = calculateFundingReadiness(c, settings);\n                const overdueMgmt = !c.isClosed && Boolean(c.nextManagementDate) && isOverdue(c.nextManagementDate);\n"
          if row_marker not in s: raise SystemExit('guarantees row marker missing')
          s = s.replace(row_marker, row_repl, 1)
          id_marker = """                      <div className=\"flex items-center gap-1.5\">\n                        <strong className=\"text-[#1E382B] font-extrabold\">{c.id}</strong>\n                        {c.isClosed && <span className=\"px-1.5 py-0.2 bg-slate-200 text-slate-700 font-bold text-[9px] rounded uppercase border border-slate-300\">Cerrado</span>}\n                      </div>\n"""
          id_repl = """                      <div className=\"flex items-center gap-1.5 flex-wrap\">\n                        <strong className=\"text-[#1E382B] font-extrabold\">{c.id}</strong>\n                        {c.isClosed && <span className=\"px-1.5 py-0.2 bg-slate-200 text-slate-700 font-bold text-[9px] rounded uppercase border border-slate-300\">Cerrado</span>}\n                        {readiness.ownerServicePending > 0 && (\n                          <span className=\"px-1.5 py-0.2 bg-sky-50 text-sky-800 font-bold text-[9px] rounded border border-sky-200\">\n                            {c.ownerServiceDeferral ? 'Diferido' : 'Pendiente prop.'} {formatCLP(readiness.ownerServicePending)}\n                          </span>\n                        )}\n                      </div>\n"""
          if id_marker not in s: raise SystemExit('guarantees id marker missing')
          s = s.replace(id_marker, id_repl, 1)
          p.write_text(s)

          # Summary: a closed case with deferred owner services is not falsely shown as having no pending obligations.
          p = Path('src/components/GuaranteeCaseDetail/SummaryTab.tsx')
          s = p.read_text()
          s = s.replace("import { calculateGuaranteeFinances } from '../../utils/calculations';", "import { calculateFundingReadiness, calculateGuaranteeFinances } from '../../utils/calculations';", 1)
          marker = "  const fin = calculateGuaranteeFinances(guaranteeCase, settings);\n  const receivable = receivables.find(r => r.caseId === guaranteeCase.id);\n"
          repl = "  const fin = calculateGuaranteeFinances(guaranteeCase, settings);\n  const readiness = calculateFundingReadiness(guaranteeCase, settings);\n  const receivable = receivables.find(r => r.caseId === guaranteeCase.id);\n"
          if marker not in s: raise SystemExit('summary calc marker missing')
          s = s.replace(marker, repl, 1)
          old_closed = """            <div>\n              <span className=\"text-[9px] uppercase font-bold text-slate-400 block\">Caso cerrado</span>\n              <strong className=\"text-sm text-slate-800\">Sin gestiones pendientes</strong>\n            </div>\n"""
          new_closed = """            <div>\n              <span className=\"text-[9px] uppercase font-bold text-slate-400 block\">Caso cerrado</span>\n              {readiness.ownerServicePending > 0 && guaranteeCase.ownerServiceDeferral ? (\n                <>\n                  <strong className=\"text-sm text-sky-800\">Pendiente propietario diferido: {formatCLP(readiness.ownerServicePending)}</strong>\n                  <span className=\"text-[10px] text-slate-500 block\">Revisar {formatDate(guaranteeCase.ownerServiceDeferral.nextReviewDate)} · {guaranteeCase.ownerServiceDeferral.responsible}</span>\n                </>\n              ) : (\n                <strong className=\"text-sm text-slate-800\">Sin gestiones pendientes</strong>\n              )}\n            </div>\n"""
          if old_closed not in s: raise SystemExit('summary closed marker missing')
          s = s.replace(old_closed, new_closed, 1)
          p.write_text(s)

          # Extend existing hardening test: unresolved owner service debt blocks closure unless explicitly deferred.
          p = Path('src/tests/hardeningRules.test.ts')
          s = p.read_text()
          s = s.replace("import { calculateGuaranteeFinances } from '../utils/calculations';", "import { calculateGuaranteeFinances } from '../utils/calculations';\nimport { isCaseCompleted } from '../context/AppContext';", 1)
          test_marker = "console.log('✓ Reglas de hardening para reparaciones canceladas y cargos Otro validadas');\n"
          test_block = """// Un saldo de servicios del propietario puede cerrarse operacionalmente solo si existe un diferimiento explícito.\nconst ownerServicesPending: GuaranteeCase = {\n  ...base,\n  plan: 'ESTANDAR',\n  liquidationStatus: 'EMITIDA',\n  guaranteeAmount: 400000,\n  receivableStatus: 'INCOBRABLE',\n  charges: [\n    {\n      id: 'CHG-DANO-CUBIERTO', category: 'REPARACIONES', description: 'Daño cubierto', amount: 400000,\n      date: '11/08/2026', type: 'DAÑO_REPARACION', notes: '', documents: [], photos: []\n    },\n    {\n      id: 'CHG-SERVICIO-PENDIENTE', category: 'GASTOS_COMUNES', description: 'GC final', amount: 200000,\n      date: '11/08/2026', type: 'GASTO_COMUN', notes: '', documents: [], photos: []\n    }\n  ]\n};\nassert.equal(isCaseCompleted(ownerServicesPending, settings), false);\nassert.equal(isCaseCompleted({\n  ...ownerServicesPending,\n  ownerServiceDeferral: {\n    amountAtDeferral: 200000,\n    reason: 'Propietario pagará al ingresar un nuevo arrendatario',\n    nextReviewDate: '15/09/2026',\n    responsible: 'Usuario',\n    createdAt: '2026-08-11T23:00:00.000Z',\n    createdBy: 'ADMINISTRADOR'\n  }\n}, settings), true);\n\nconsole.log('✓ Reglas de hardening, cargos y diferimiento de pendientes propietario validadas');\n"""
          if test_marker not in s: raise SystemExit('test marker missing')
          s = s.replace(test_marker, test_block, 1)
          p.write_text(s)
          PY

          git diff --check
      - name: Validar
        run: |
          npm ci
          npm run lint
          npm run test:rules
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/context/AppContext.tsx src/components/FullCoverageCaseBanner.tsx src/components/Dashboard.tsx src/components/GuaranteesList.tsx src/components/GuaranteeCaseDetail/SummaryTab.tsx src/tests/hardeningRules.test.ts
          git commit -m "Permitir diferir pendientes de servicios del propietario"
          git push origin HEAD:pendiente-propietario-diferido
