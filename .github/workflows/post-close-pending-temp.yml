name: Implementar seguimiento posterior propietario

on:
  push:
    branches: [seguimiento-posterior-garantia]
    paths:
      - .github/workflows/post-close-pending-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seguimiento-posterior-garantia
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Aplicar cambios
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{label} missing in {path}')
              p.write_text(s.replace(old, new, 1))

          # 1) Tipos: el pendiente posterior es un registro distinto al diferimiento previo al cierre.
          replace_once(
              'src/types.ts',
              "export interface OwnerServiceDeferral {\n  amountAtDeferral: number;\n  reason: string;\n  nextReviewDate: string;\n  responsible: string;\n  createdAt: string;\n  createdBy: string;\n}\n",
              "export interface OwnerServiceDeferral {\n  amountAtDeferral: number;\n  reason: string;\n  nextReviewDate: string;\n  responsible: string;\n  createdAt: string;\n  createdBy: string;\n}\n\nexport interface OwnerPostClosePending {\n  amountAtTransfer: number;\n  reason: string;\n  nextReviewDate: string;\n  responsible: string;\n  transferredAt: string;\n  transferredBy: string;\n  status: 'PENDIENTE' | 'RESUELTO';\n  resolvedAt?: string;\n  resolvedBy?: string;\n  resolutionNote?: string;\n}\n",
              'types pending interface'
          )
          replace_once(
              'src/types.ts',
              "  faunaFinancing: number;\n  ownerServiceDeferral?: OwnerServiceDeferral;\n",
              "  faunaFinancing: number;\n  ownerServiceDeferral?: OwnerServiceDeferral;\n  ownerPostClosePending?: OwnerPostClosePending;\n",
              'types guarantee field'
          )

          # 2) Regla de completitud: antes del cierre exige pago o diferimiento; después acepta el seguimiento posterior.
          replace_once(
              'src/context/AppContext.tsx',
              "  if (readiness.ownerServicePending > 0 && !c.ownerServiceDeferral) return false;\n",
              "  if (readiness.ownerServicePending > 0 && !c.ownerServiceDeferral && !c.ownerPostClosePending) return false;\n",
              'completion owner pending'
          )
          replace_once(
              'src/context/AppContext.tsx',
              "      if (calculateFundingReadiness(targetCase, settings).ownerServicePending > 0 && !targetCase.ownerServiceDeferral) pending.push('gastos comunes/servicios pendientes del propietario sin acuerdo de diferimiento');\n",
              "      if (calculateFundingReadiness(targetCase, settings).ownerServicePending > 0 && !targetCase.ownerServiceDeferral && !targetCase.ownerPostClosePending) pending.push('gastos comunes/servicios pendientes del propietario sin acuerdo de diferimiento');\n",
              'close pending message'
          )

          # 3) Al cerrar, el diferimiento se convierte explícitamente en seguimiento posterior.
          p = Path('src/context/AppContext.tsx')
          s = p.read_text()
          old = """    setCases(prev => prev.map(c => c.id === caseId ? {\n      ...c,\n      isClosed: true,\n      closedAt: new Date().toLocaleString('es-CL'),\n      closedBy: userRole,\n      isCompleted: true\n    } : c));\n    logAudit(caseId, 'Cierre de Caso', `Caso ${caseId} cerrado por ${userRole}`);\n    return { success: true, message: 'Caso cerrado con éxito.' };\n"""
          new = """    const readinessAtClose = calculateFundingReadiness(targetCase, settings);\n    const pendingToTransfer = readinessAtClose.ownerServicePending;\n    const existingPostClosePending = targetCase.ownerPostClosePending;\n    const postClosePending = pendingToTransfer > 0 && targetCase.ownerServiceDeferral\n      ? {\n          amountAtTransfer: existingPostClosePending?.amountAtTransfer || pendingToTransfer,\n          reason: targetCase.ownerServiceDeferral.reason,\n          nextReviewDate: targetCase.ownerServiceDeferral.nextReviewDate,\n          responsible: targetCase.ownerServiceDeferral.responsible,\n          transferredAt: existingPostClosePending?.transferredAt || new Date().toISOString(),\n          transferredBy: existingPostClosePending?.transferredBy || userRole,\n          status: 'PENDIENTE' as const\n        }\n      : existingPostClosePending;\n\n    setCases(prev => prev.map(c => c.id === caseId ? {\n      ...c,\n      isClosed: true,\n      closedAt: new Date().toLocaleString('es-CL'),\n      closedBy: userRole,\n      isCompleted: true,\n      ownerPostClosePending: postClosePending,\n      ownerServiceDeferral: postClosePending ? undefined : c.ownerServiceDeferral,\n      nextManagement: '',\n      nextManagementDate: '',\n      nextManagementResponsible: ''\n    } : c));\n\n    if (postClosePending && pendingToTransfer > 0) {\n      logAudit(\n        caseId,\n        'Pendiente propietario traspasado',\n        `${formatDate(postClosePending.nextReviewDate)} · ${postClosePending.responsible} · saldo ${pendingToTransfer} trasladado a seguimiento posterior para permitir cierre de garantía/contrato`\n      );\n    }\n    logAudit(caseId, 'Cierre de Caso', `Caso ${caseId} cerrado por ${userRole}`);\n    return {\n      success: true,\n      message: postClosePending && pendingToTransfer > 0\n        ? 'Garantía cerrada. El pendiente del propietario quedó traspasado a seguimiento posterior.'\n        : 'Caso cerrado con éxito.'\n    };\n"""
          if old not in s: raise SystemExit('close body marker missing')
          p.write_text(s.replace(old, new, 1))

          # 4) Banner financiero: una garantía cerrada ya no permite volver a diferir; muestra seguimiento posterior y permite resolverlo con un pago real.
          p = Path('src/components/FullCoverageCaseBanner.tsx')
          s = p.read_text()
          old = """  const damagePending = readiness.ownerRepairPendingProvision;\n  const servicesPending = readiness.ownerServicePending;\n  const activeServiceDeferral = servicesPending > 0 ? guaranteeCase.ownerServiceDeferral : undefined;\n  const selectedPending = paymentPurpose === 'REPARACIONES' ? damagePending : servicesPending;\n"""
          new = """  const damagePending = readiness.ownerRepairPendingProvision;\n  const servicesPending = readiness.ownerServicePending;\n  const activeServiceDeferral = servicesPending > 0 && !guaranteeCase.isClosed ? guaranteeCase.ownerServiceDeferral : undefined;\n  const postClosePending = servicesPending > 0 && guaranteeCase.isClosed ? guaranteeCase.ownerPostClosePending : undefined;\n  const selectedPending = paymentPurpose === 'REPARACIONES' ? damagePending : servicesPending;\n"""
          if old not in s: raise SystemExit('banner pending marker missing')
          s = s.replace(old, new, 1)

          old = """    updateGuaranteeCase(guaranteeCase.id, {\n      // Este saldo representa lo efectivamente asumido por el propietario y todavía no recuperado.\n      ownerContribution: (guaranteeCase.ownerContribution || 0) + paymentAmount\n    });\n"""
          new = """    const resolvesPostClosePending = Boolean(\n      guaranteeCase.isClosed\n      && guaranteeCase.ownerPostClosePending\n      && paymentPurpose === 'SERVICIOS'\n      && paymentAmount >= pending\n    );\n\n    updateGuaranteeCase(guaranteeCase.id, {\n      // Este saldo representa lo efectivamente asumido por el propietario y todavía no recuperado.\n      ownerContribution: (guaranteeCase.ownerContribution || 0) + paymentAmount,\n      ownerPostClosePending: guaranteeCase.ownerPostClosePending\n        ? {\n            ...guaranteeCase.ownerPostClosePending,\n            status: resolvesPostClosePending ? 'RESUELTO' : guaranteeCase.ownerPostClosePending.status,\n            resolvedAt: resolvesPostClosePending ? new Date().toISOString() : guaranteeCase.ownerPostClosePending.resolvedAt,\n            resolvedBy: resolvesPostClosePending ? userRole : guaranteeCase.ownerPostClosePending.resolvedBy,\n            resolutionNote: resolvesPostClosePending\n              ? `Pendiente cubierto mediante pago del propietario (${paymentMode === 'TRANSFERIDO_FAUNA' ? 'transferido a Fauna' : 'pago directo'}).`\n              : guaranteeCase.ownerPostClosePending.resolutionNote\n          }\n        : undefined\n    });\n\n    if (resolvesPostClosePending) {\n      logAudit(\n        guaranteeCase.id,\n        'Seguimiento posterior resuelto',\n        `Pendiente del propietario por ${formatCLP(pending)} resuelto mediante pago registrado`\n      );\n    }\n"""
          if old not in s: raise SystemExit('banner update payment marker missing')
          s = s.replace(old, new, 1)

          s = s.replace(
              "  const openServiceDeferral = () => {\n    if (!isConfirmed || servicesPending <= 0) return;\n",
              "  const openServiceDeferral = () => {\n    if (!isConfirmed || guaranteeCase.isClosed || servicesPending <= 0) return;\n",
              1
          )
          s = s.replace(
              "    if (!isConfirmed || servicesPending <= 0) return;\n",
              "    if (!isConfirmed || guaranteeCase.isClosed || servicesPending <= 0) return;\n",
              1
          )

          old = """                {activeServiceDeferral ? (\n                  <>\n                    <span className=\"block mt-0.5 font-semibold text-sky-100\">Pendiente diferido: {activeServiceDeferral.reason}</span>\n                    <span className=\"block mt-0.5 text-sky-200\">Revisar {formatDate(activeServiceDeferral.nextReviewDate)} · {activeServiceDeferral.responsible}</span>\n                  </>\n                ) : (\n                  <span className=\"block mt-0.5\">Este saldo no bloquea la liquidación. Después de confirmar puedes registrar el pago o dejar formalmente el pendiente diferido.</span>\n                )}\n"""
          new = """                {postClosePending ? (\n                  <>\n                    <span className=\"block mt-0.5 font-semibold text-sky-100\">Seguimiento posterior: {postClosePending.reason}</span>\n                    <span className=\"block mt-0.5 text-sky-200\">Revisar {formatDate(postClosePending.nextReviewDate)} · {postClosePending.responsible}</span>\n                  </>\n                ) : activeServiceDeferral ? (\n                  <>\n                    <span className=\"block mt-0.5 font-semibold text-sky-100\">Pendiente diferido: {activeServiceDeferral.reason}</span>\n                    <span className=\"block mt-0.5 text-sky-200\">Revisar {formatDate(activeServiceDeferral.nextReviewDate)} · {activeServiceDeferral.responsible}</span>\n                  </>\n                ) : (\n                  <span className=\"block mt-0.5\">Este saldo no bloquea la liquidación. Después de confirmar puedes registrar el pago o dejar formalmente el pendiente diferido.</span>\n                )}\n"""
          if old not in s: raise SystemExit('banner owner service text missing')
          s = s.replace(old, new, 1)
          s = s.replace("              {isConfirmed && (\n", "              {isConfirmed && !guaranteeCase.isClosed && (\n", 1)
          p.write_text(s)

          # 5) Resumen: una garantía cerrada ya no conserva una "gestión pendiente" de garantía; muestra el seguimiento posterior separado.
          p = Path('src/components/GuaranteeCaseDetail/SummaryTab.tsx')
          s = p.read_text()
          old = """              {readiness.ownerServicePending > 0 && guaranteeCase.ownerServiceDeferral ? (\n                <>\n                  <strong className=\"text-sm text-sky-800\">Pendiente propietario diferido: {formatCLP(readiness.ownerServicePending)}</strong>\n                  <span className=\"text-[10px] text-slate-500 block\">Revisar {formatDate(guaranteeCase.ownerServiceDeferral.nextReviewDate)} · {guaranteeCase.ownerServiceDeferral.responsible}</span>\n                </>\n              ) : (\n                <strong className=\"text-sm text-slate-800\">Sin gestiones pendientes</strong>\n              )}\n"""
          new = """              {readiness.ownerServicePending > 0 && guaranteeCase.ownerPostClosePending ? (\n                <>\n                  <strong className=\"text-sm text-sky-800\">Garantía cerrada · seguimiento posterior propietario {formatCLP(readiness.ownerServicePending)}</strong>\n                  <span className=\"text-[10px] text-slate-500 block\">No bloquea el contrato · revisar {formatDate(guaranteeCase.ownerPostClosePending.nextReviewDate)} · {guaranteeCase.ownerPostClosePending.responsible}</span>\n                </>\n              ) : (\n                <strong className=\"text-sm text-slate-800\">Sin gestiones pendientes de garantía</strong>\n              )}\n"""
          if old not in s: raise SystemExit('summary closed pending marker missing')
          p.write_text(s.replace(old, new, 1))

          # 6) Lista de garantías: distinguir claramente pendientes posteriores y conservar su próxima revisión al cerrar.
          p = Path('src/components/GuaranteesList.tsx')
          s = p.read_text()
          old = """                        {readiness.ownerServicePending > 0 && (\n                          <span className=\"px-1.5 py-0.2 bg-sky-50 text-sky-800 font-bold text-[9px] rounded border border-sky-200\">\n                            {c.ownerServiceDeferral ? 'Diferido' : 'Pendiente prop.'} {formatCLP(readiness.ownerServicePending)}\n                          </span>\n                        )}\n"""
          new = """                        {readiness.ownerServicePending > 0 && (\n                          <span className=\"px-1.5 py-0.2 bg-sky-50 text-sky-800 font-bold text-[9px] rounded border border-sky-200\">\n                            {c.ownerPostClosePending ? 'Seguimiento posterior' : c.ownerServiceDeferral ? 'Diferido' : 'Pendiente prop.'} {formatCLP(readiness.ownerServicePending)}\n                          </span>\n                        )}\n"""
          if old not in s: raise SystemExit('guarantees badge marker missing')
          s = s.replace(old, new, 1)

          old = """                      {c.isClosed ? (\n                        <div className=\"space-y-1\">\n                          <span className=\"text-emerald-800 font-bold text-xs block\">Caso cerrado</span>\n                          <span className=\"text-[10px] text-slate-500 inline-flex items-center gap-0.5\">\n                            <UserCheck className=\"w-3 h-3 text-[#2D8B73]\" />\n                            {c.closedBy || c.responsible}\n                          </span>\n                        </div>\n                      ) : (\n"""
          new = """                      {c.isClosed ? (\n                        <div className=\"space-y-1\">\n                          {readiness.ownerServicePending > 0 && c.ownerPostClosePending ? (\n                            <>\n                              <span className=\"text-sky-800 font-bold text-xs block\">Seguimiento posterior propietario</span>\n                              <div className=\"flex items-center gap-1.5 flex-wrap\">\n                                <span className=\"px-1.5 py-0.2 rounded text-[10px] font-bold bg-sky-50 text-sky-800 border border-sky-200\">{formatShortDateStr(c.ownerPostClosePending.nextReviewDate)}</span>\n                                <span className=\"text-[10px] text-slate-500 font-medium inline-flex items-center gap-0.5\"><UserCheck className=\"w-3 h-3 text-[#2D8B73]\" />{c.ownerPostClosePending.responsible}</span>\n                              </div>\n                            </>\n                          ) : (\n                            <>\n                              <span className=\"text-emerald-800 font-bold text-xs block\">Caso cerrado</span>\n                              <span className=\"text-[10px] text-slate-500 inline-flex items-center gap-0.5\">\n                                <UserCheck className=\"w-3 h-3 text-[#2D8B73]\" />\n                                {c.closedBy || c.responsible}\n                              </span>\n                            </>\n                          )}\n                        </div>\n                      ) : (\n"""
          if old not in s: raise SystemExit('guarantees closed management marker missing')
          p.write_text(s.replace(old, new, 1))

          # 7) Dashboard: separar visualmente saldos activos del proceso y seguimientos posteriores ya cerrados.
          p = Path('src/components/Dashboard.tsx')
          s = p.read_text()
          old = """  const ownerServicePending = cases.reduce(\n    (sum, c) => sum + (fundingByCase.get(c.id)?.ownerServicePending || 0),\n    0\n  );\n  const ownerServiceDeferredCount = cases.filter(c =>\n    Boolean(c.ownerServiceDeferral) && (fundingByCase.get(c.id)?.ownerServicePending || 0) > 0\n  ).length;\n"""
          new = """  const ownerServicePendingOpen = openCases.reduce(\n    (sum, c) => sum + (fundingByCase.get(c.id)?.ownerServicePending || 0),\n    0\n  );\n  const ownerPostClosePending = cases\n    .filter(c => c.isClosed && Boolean(c.ownerPostClosePending))\n    .reduce((sum, c) => sum + (fundingByCase.get(c.id)?.ownerServicePending || 0), 0);\n  const ownerServicePending = ownerServicePendingOpen + ownerPostClosePending;\n  const ownerPostClosePendingCount = cases.filter(c =>\n    c.isClosed && Boolean(c.ownerPostClosePending) && (fundingByCase.get(c.id)?.ownerServicePending || 0) > 0\n  ).length;\n"""
          if old not in s: raise SystemExit('dashboard owner pending calc missing')
          s = s.replace(old, new, 1)
          old = """              <div><span className=\"text-[10px] font-extrabold text-slate-600 uppercase block\">Servicios pendientes del propietario</span><span className=\"text-[11px] text-slate-500\">No bloquean la liquidación{ownerServiceDeferredCount > 0 ? ` · ${ownerServiceDeferredCount} diferido${ownerServiceDeferredCount > 1 ? 's' : ''}` : ''}</span></div>\n"""
          new = """              <div><span className=\"text-[10px] font-extrabold text-slate-600 uppercase block\">Servicios pendientes del propietario</span><span className=\"text-[11px] text-slate-500\">{ownerPostClosePendingCount > 0 ? `${formatCLP(ownerPostClosePending)} en seguimiento posterior · ${ownerPostClosePendingCount} caso${ownerPostClosePendingCount > 1 ? 's' : ''}` : 'No bloquean la liquidación'}</span></div>\n"""
          if old not in s: raise SystemExit('dashboard owner pending card missing')
          p.write_text(s.replace(old, new, 1))

          # 8) Pruebas: un seguimiento posterior permite mantener garantía cerrada sin volver a activar el flujo principal.
          p = Path('src/tests/hardeningRules.test.ts')
          s = p.read_text()
          marker = """assert.equal(isCaseCompleted({\n  ...ownerServicesPending,\n  ownerServiceDeferral: {\n    amountAtDeferral: 200000,\n    reason: 'Propietario pagará al ingresar un nuevo arrendatario',\n    nextReviewDate: '15/09/2026',\n    responsible: 'Usuario',\n    createdAt: '2026-08-11T23:00:00.000Z',\n    createdBy: 'ADMINISTRADOR'\n  }\n}, settings), true);\n\nconsole.log('✓ Reglas de hardening, cargos y diferimiento de pendientes propietario validadas');\n"""
          replacement = """assert.equal(isCaseCompleted({\n  ...ownerServicesPending,\n  ownerServiceDeferral: {\n    amountAtDeferral: 200000,\n    reason: 'Propietario pagará al ingresar un nuevo arrendatario',\n    nextReviewDate: '15/09/2026',\n    responsible: 'Usuario',\n    createdAt: '2026-08-11T23:00:00.000Z',\n    createdBy: 'ADMINISTRADOR'\n  }\n}, settings), true);\n\nassert.equal(isCaseCompleted({\n  ...ownerServicesPending,\n  isClosed: true,\n  ownerPostClosePending: {\n    amountAtTransfer: 200000,\n    reason: 'Propietario pagará al ingresar un nuevo arrendatario',\n    nextReviewDate: '15/09/2026',\n    responsible: 'Usuario',\n    transferredAt: '2026-08-12T03:00:00.000Z',\n    transferredBy: 'ADMINISTRADOR',\n    status: 'PENDIENTE'\n  }\n}, settings), true);\n\nconsole.log('✓ Reglas de hardening, cargos, diferimiento y seguimiento posterior propietario validadas');\n"""
          if marker not in s: raise SystemExit('hardening test marker missing')
          p.write_text(s.replace(marker, replacement, 1))
          PY
      - name: Validar
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit
        run: |
          git config user.name "matias694"
          git config user.email "matias@faunapropiedades.cl"
          git add src
          git commit -m "Separate post-close owner follow-up from guarantee closure"
          git push origin seguimiento-posterior-garantia
