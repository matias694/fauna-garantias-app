name: Corregir migracion auditoria

on:
  push:
    branches: [auditoria-final-integridad]
    paths:
      - .github/workflows/migration-audit-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auditoria-final-integridad
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Aplicar parche
        run: python scripts/migration_audit_patch.py
      - name: Validar
        run: |
          npm ci
          npm run lint
          npm run test:rules
          npm run build
      - name: Commit
        run: |
          rm -f .github/workflows/migration-audit-temp.yml scripts/migration_audit_patch.py
          git config user.name 'matias694'
          git config user.email 'matias@faunapropiedades.cl'
          git add -A
          git commit -m 'Migrar pendientes diferidos de casos ya cerrados'
          git push origin auditoria-final-integridad
