name: Cierre auditoria integral

on:
  push:
    branches: [auditoria-final-integridad]
    paths:
      - .github/workflows/final-integrity-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auditoria-final-integridad
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Aplicar parche final
        run: python scripts/final_integrity_patch.py
      - name: Revisar residuos conocidos
        run: |
          if grep -RIn "alert(" src --include='*.ts' --include='*.tsx'; then
            echo 'Quedaron alert() nativos en código activo'
            exit 1
          fi
          if grep -RIn "toISOString().split\|toISOString().slice" src --include='*.ts' --include='*.tsx'; then
            echo 'Quedaron fechas calendario derivadas desde UTC'
            exit 1
          fi
          if grep -RIn "RepairsTab\|MovementsTab" src --include='*.ts' --include='*.tsx'; then
            echo 'Quedaron referencias a componentes legacy eliminados'
            exit 1
          fi
      - name: Validar aplicación
        run: |
          npm ci
          npm run lint
          npm run test:rules
          npm run build
      - name: Commit
        run: |
          rm -f .github/workflows/final-integrity-temp.yml scripts/final_integrity_patch.py
          git config user.name 'matias694'
          git config user.email 'matias@faunapropiedades.cl'
          git add -A
          git commit -m 'Cerrar auditoría integral de integridad y estados'
          git push origin auditoria-final-integridad
